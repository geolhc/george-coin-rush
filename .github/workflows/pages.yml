name: Import cabinet source
on: push
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the initial project into the repository
        run: |
          unzip -o cabinet-source.zip
          git rm cabinet-source.zip
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Install cabinet physics, renderer, sound, co-op server and tests'
          git push
