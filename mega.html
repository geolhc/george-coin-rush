<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f19"><title>MEGA MACHINE | GEORGE COIN RUSH</title></head>
<body><div class="shell"><header><strong class="brand"><i>G</i> GEORGE <b>ARCADE</b></strong><nav><a href="./">Classic mode</a><button id="sound" aria-label="Mute audio">♪</button><button id="settings" aria-label="Machine settings">☷</button></nav></header>
<main><section class="mast"><div><small>GEORGE COIN RUSH <span>/</span> メガマシン</small><h1>MEGA <em>MACHINE</em></h1></div><div class="count"><b id="linked">0 / 4</b><small>CORES ONLINE</small></div></section>
